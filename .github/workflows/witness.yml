# Hunt the heap corruption on a machine nobody minds losing.
#
# ⛔⛔ THE REASON THIS IS A WORKFLOW AND NOT A SCRIPT ON A DESK. A Go string in
# xrdesk loses its first four bytes now and then, and the one measurement that
# makes the fault tractable is that it depends on the NUMBER of virtual
# displays: 0 of 3 runs at one display, 2 of 3 at five. Reproducing it therefore
# means creating five virtual displays over and over -- which, run unattended on
# the author's Mac on 2026-09-11, froze it and cost a reboot.
#
# A runner is the machine that may be frozen. It is also the only way to get a
# RATE rather than an anecdote: a fault that shows two times in three needs
# twenty runs, and nobody's workstation should be asked for twenty.
#
# ⛔ It is manual. Nothing about this belongs on a push: it is an experiment,
# it takes a runner for minutes, and its answer is a number somebody reads.
name: witness

on:
  workflow_dispatch:
    inputs:
      displays:
        description: "virtual displays per round (the fault depends on this number; 1 is the control)"
        default: "5"
      rounds:
        description: "how many rounds"
        default: "10"
      settle:
        description: "how long to leave the displays up before looking"
        default: "2s"
      desk:
        description: "also run a real desk session with a stand-in for the glasses (yes/no)"
        default: "yes"

permissions:
  contents: read

jobs:
  hunt:
    name: witnesses on a macOS runner
    runs-on: macos-latest
    # The bench stops itself when creation slows down, and this stops it when
    # the thing that hangs is not creation. See the darwin lane in ci.yml for
    # what a 54-minute silence costs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      # ⛔ FIRST, WHETHER THIS MACHINE CAN DO IT AT ALL. A runner without the
      # private virtual-display API reports every round clean, which reads
      # exactly like a runner where the fault did not happen. The bench says
      # "RESULT unavailable" instead, and that is the difference between a
      # negative result and no result.
      - name: can this runner make virtual displays
        run: CGO_ENABLED=0 go run ./cmd/witnessbench -i-can-freeze-this-machine -rounds 1 -displays 1 -settle 1s
      - name: hunt
        run: |
          CGO_ENABLED=0 go run ./cmd/witnessbench \
            -i-can-freeze-this-machine \
            -rounds ${{ inputs.rounds }} \
            -displays ${{ inputs.displays }} \
            -settle ${{ inputs.settle }}

      # ⛔⛔ AND THEN THE REAL DESK, because the bench above came back 0 of 10 at
      # five displays where the desk had come back 2 of 3. Creating the displays
      # is evidently not what carries the fault: the desk also captures screens,
      # places applications, loads fonts and draws sixty frames a second, and
      # one of those is doing it. A bench that reproduces nothing has narrowed
      # the question rather than answered it, and this step is the other half.
      #
      # ⛔ It must not be read as a failure when it cannot run. A runner has no
      # screen-recording grant and no signed bundle, so the desk may stop before
      # it starts -- which says nothing at all about the corruption. The step
      # therefore always succeeds and the JOURNAL is what is read.
      - name: a real desk session, with a stand-in for the glasses
        if: ${{ inputs.desk == 'yes' }}
        run: |
          CGO_ENABLED=0 go build -o /tmp/standin ./cmd/standin
          CGO_ENABLED=0 go build -o /tmp/xrdesk ./cmd/xrdesk
          # The stand-in holds a display under a headset's name; the desk finds
          # it in the catalogue and runs everything after the choice unchanged.
          /tmp/standin -model "XREAL 1S" -for 90s &
          sleep 8
          /tmp/xrdesk -screens ${{ inputs.displays }} -for 40s -dim=false || true
          wait || true
      - name: what the journals said
        if: ${{ always() && inputs.desk == 'yes' }}
        run: |
          shopt -s nullglob
          logs=("$HOME/Library/Application Support/xrdesk/logs/"*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "RESULT desk-never-started: no journal was written"
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "=== $f"
            cat "$f"
          done
          if grep -qi "heap corruption was CAUGHT" "${logs[@]}"; then
            echo "RESULT desk-caught"
          elif grep -qi "witness strings are watching" "${logs[@]}"; then
            echo "RESULT desk-ran-clean: the instrument was armed and saw nothing"
          else
            echo "RESULT desk-never-reached-the-watch-loop"
          fi
