# Hunt the heap corruption on a machine nobody minds losing.
#
# ⛔⛔ THE REASON THIS IS A WORKFLOW AND NOT A SCRIPT ON A DESK. A Go string in
# xrdesk loses its first four bytes now and then, and the one measurement that
# makes the fault tractable is that it depends on the NUMBER of virtual
# displays: 0 of 3 runs at one display, 2 of 3 at five. Reproducing it therefore
# means creating five virtual displays over and over -- which, run unattended on
# the author's Mac on 2026-09-11, froze it and cost a reboot.
#
# A runner is the machine that may be frozen. It is also the only way to get a
# RATE rather than an anecdote: a fault that shows two times in three needs
# twenty runs, and nobody's workstation should be asked for twenty.
#
# ⛔ It is manual. Nothing about this belongs on a push: it is an experiment,
# it takes a runner for minutes, and its answer is a number somebody reads.
name: witness

on:
  workflow_dispatch:
    inputs:
      displays:
        description: "virtual displays per round (the fault depends on this number; 1 is the control)"
        default: "5"
      rounds:
        description: "how many rounds"
        default: "10"
      settle:
        description: "how long to leave the displays up before looking"
        default: "2s"
      desk:
        description: "also run real desk sessions with a stand-in for the glasses (yes/no)"
        default: "yes"
      sessions:
        description: "how many desk sessions; one clean session is one chance in three, so a rate needs ten"
        default: "10"
      widths:
        description: "also sweep the widths the window server refuses (yes/no)"
        default: "yes"

permissions:
  contents: read

jobs:
  hunt:
    name: witnesses on a macOS runner
    runs-on: macos-latest
    # The bench stops itself when creation slows down, and this stops it when
    # the thing that hangs is not creation. See the darwin lane in ci.yml for
    # what a 54-minute silence costs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      # ⛔ FIRST, WHETHER THIS MACHINE CAN DO IT AT ALL. A runner without the
      # private virtual-display API reports every round clean, which reads
      # exactly like a runner where the fault did not happen. The bench says
      # "RESULT unavailable" instead, and that is the difference between a
      # negative result and no result.
      - name: can this runner make virtual displays
        run: CGO_ENABLED=0 go run ./cmd/witnessbench -i-can-freeze-this-machine -rounds 1 -displays 1 -settle 1s
      - name: hunt
        run: |
          CGO_ENABLED=0 go run ./cmd/witnessbench \
            -i-can-freeze-this-machine \
            -rounds ${{ inputs.rounds }} \
            -displays ${{ inputs.displays }} \
            -settle ${{ inputs.settle }}

      # ⛔⛔ THE WIDTHS THE WINDOW SERVER REFUSES, because the first hunt never
      # asked for one. Measured on the author's Mac on 2026-09-07: 3840, 4096
      # and 7680 refused at EVERY height tried, while 3839, 3841 and 4095 opened
      # in half a second, and 6400x1440 opened too. Particular widths are
      # poison; it is not about size.
      #
      # That matters here because the desk MEETS those refusals -- it asks, is
      # told no, and asks again one pixel over -- while the runner opened
      # 1920x1200 first try and never walked that path at all. What the private
      # API does with the pointers it was handed when it then FAILS is a
      # question nothing has asked yet, and a four-byte write of zeros is
      # exactly what a half-finished call leaves behind.
      #
      # The refused widths may differ on a runner. The bench reports how many
      # were refused, so the sweep measures that rather than assuming it.
      - name: the widths that get refused
        if: ${{ inputs.widths == 'yes' }}
        run: |
          for w in 1920 3840 4096 6784 7680; do
            echo "--- $w wide"
            CGO_ENABLED=0 go run ./cmd/witnessbench \
              -i-can-freeze-this-machine \
              -rounds 3 -displays ${{ inputs.displays }} \
              -width "$w" -height 1080 -settle 2s
          done

      # ⛔⛔ AND THEN THE REAL DESK, because the bench above came back 0 of 10 at
      # five displays where the desk had come back 2 of 3. Creating the displays
      # is evidently not what carries the fault: the desk also captures screens,
      # places applications, loads fonts and draws sixty frames a second, and
      # one of those is doing it. A bench that reproduces nothing has narrowed
      # the question rather than answered it, and this step is the other half.
      #
      # ⛔ It must not be read as a failure when it cannot run. A runner has no
      # screen-recording grant and no signed bundle, so the desk may stop before
      # it starts -- which says nothing at all about the corruption. The step
      # therefore always succeeds and the JOURNAL is what is read.
      # ⛔⛔ REPEATED, because ONE clean session is one chance in three. The
      # measurement being matched is 2 of 3 sessions damaged, so a single clean
      # run is the likeliest thing to happen even when the fault is fully
      # present. Reading it as "the runner does not reproduce it" would be
      # reading a coin that came up tails once as a two-headed coin.
      #
      # One stand-in for the whole loop, because that is what a headset is: it
      # stays plugged in while desks come and go.
      - name: desk sessions, with a stand-in for the glasses
        if: ${{ inputs.desk == 'yes' }}
        run: |
          CGO_ENABLED=0 go build -o /tmp/standin ./cmd/standin
          CGO_ENABLED=0 go build -o /tmp/xrdesk ./cmd/xrdesk
          n=${{ inputs.sessions }}
          # ⛔⛔ THE FIRST RUN OF THIS LOOP CHANGED WHAT IT WAS MEASURING HALF
          # WAY THROUGH AND SAID NOTHING. The hold was n*30+40 seconds against
          # sessions that actually took about 38, so the stand-in expired with
          # two sessions to go: one took no measurement and one ran with no
          # headset-shaped display at all, which is a different experiment
          # wearing the same name. 45 leaves room, and the check below is what
          # makes the bound unnecessary to trust.
          hold=$(( n * 45 + 90 ))
          /tmp/standin -model "XREAL 1S" -for ${hold}s &
          standin=$!
          sleep 8
          for i in $(seq 1 "$n"); do
            # ⛔ AND IT IS CHECKED BEFORE EVERY SESSION RATHER THAN COMPUTED
            # ONCE. A harness that quietly changes configuration is the defect
            # this whole hunt keeps turning up in other people's code; a bound
            # that has to be right in advance is a guess, and this is a
            # measurement.
            if ! kill -0 "$standin" 2>/dev/null; then
              echo "RESULT harness-broke: the stand-in was gone before session $i of $n, "\
                "so the sessions after it measured a different machine"
              exit 1
            fi
            echo "--- session $i of $n"
            # ⛔ 25s is not arbitrary: the damage has always arrived within
            # about 1.4s of the displays being made, so a session that gets
            # that far has asked the question. Longer sessions buy nothing and
            # cost runner minutes that buy MORE SESSIONS, which is what a rate
            # needs.
            /tmp/xrdesk -screens ${{ inputs.displays }} -for 25s -dim=false || true
            sleep 2
          done
          kill "$standin" 2>/dev/null || true
          wait || true
      - name: what the journals said
        if: ${{ always() && inputs.desk == 'yes' }}
        run: |
          shopt -s nullglob
          logs=("$HOME/Library/Application Support/xrdesk/logs/"*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "RESULT desk-never-started: no journal was written"
            exit 0
          fi
          caught=0 armed=0 mute=0
          for f in "${logs[@]}"; do
            echo "=== $f"
            cat "$f"
            if grep -qi "heap corruption was CAUGHT" "$f"; then
              caught=$((caught + 1))
            elif grep -qi "witness strings are watching" "$f"; then
              armed=$((armed + 1))
            else
              # ⛔ COUNTED SEPARATELY AND NEVER AS CLEAN. A session that never
              # reached the watch loop took no measurement, and folding it in
              # with the clean ones would quietly lower a rate with runs that
              # never asked the question.
              mute=$((mute + 1))
            fi
          done
          echo "RESULT desk ${caught} caught, ${armed} armed and clean, ${mute} took no measurement, of ${#logs[@]} sessions"
