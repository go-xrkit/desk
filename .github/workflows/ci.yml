name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: workflows parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A workflow that fails to PARSE reports nothing at all: no jobs run, no
      # checks appear, and the pull request looks unexercised rather than
      # broken. This is the only lane that would notice.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  darwin:
    name: darwin (the platform playback runs on)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
      # The gate is on the PORTABLE files. Playback needs a display, a video file
      # and a pair of glasses, none of which a runner has; a total-coverage gate
      # would therefore be a number chosen to pass rather than a standard.
      - name: 100% coverage gate on the portable logic
        shell: bash
        run: |
          # Every file that is not platform-specific, not a command, and does not
          # need a real display. Selecting by SHAPE rather than by a list of
          # names means a new portable file is gated the day it is written,
          # instead of the day someone remembers to add it here.
          #
          # A _display.go suffix is the third shape: code that can only run with a
          # window server in front of it. It is NAMED rather than listed, so the
          # exemption is visible in the file name instead of buried in CI, and
          # it stays deliberately thin — wiring pieces that ARE covered.
          go tool cover -func=cover.out \
            | grep -v '_display\.go:' \
            | grep -v '_darwin\.go:' \
            | grep -v '/cmd/' \
            | grep -v '^total:' > portable.txt || true
          cat portable.txt
          if [ ! -s portable.txt ]; then
            echo "::error::no portable files were measured at all; the filter is wrong"; exit 1
          fi
          if grep -v '100\.0%' portable.txt; then
            echo "::error::the portable logic is below 100% (lines above)"; exit 1
          fi
          echo "portable logic: 100%"

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  linux:
    name: linux (portable logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 go test -count=1 ./...
