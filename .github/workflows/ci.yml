name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    name: workflows parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A workflow that fails to PARSE reports nothing at all: no jobs run, no
      # checks appear, and the pull request looks unexercised rather than
      # broken. This is the only lane that would notice.
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  gofmt:
    name: gofmt + tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: nothing big is tracked
        shell: bash
        run: |
          # A repository carries what it is given for ever. `go build ./cmd/x`
          # with no -o writes a 22 MB executable into the working tree, named
          # after the package, and one `git add -A` later it is in the history
          # of every clone. That happened here: three binaries, 57 MB, removed
          # by rewriting the history of a shared branch -- which is a bad
          # afternoon and a worse one for anybody who had cloned it.
          #
          # A megabyte is the line. Nothing this repository legitimately tracks
          # comes near it: the largest source file is a few tens of kilobytes.
          big=$(git ls-files -z | xargs -0 -I{} find {} -type f -size +1024k -print)
          if [ -n "$big" ]; then
            echo "$big" | while read -r f; do
              echo "::error file=$f::$f is $(du -h "$f" | cut -f1) and is tracked; \
          a repository keeps what it is given for ever"
            done
            exit 1
          fi
          echo "nothing tracked is over a megabyte"
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  darwin:
    name: darwin (the platform playback runs on)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: CGO_ENABLED=0 go test -count=1 -coverprofile=cover.out ./...
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
      # The gate is on the PORTABLE files. Playback needs a display, a video file
      # and a pair of glasses, none of which a runner has; a total-coverage gate
      # would therefore be a number chosen to pass rather than a standard.
      - name: 100% coverage gate on the portable logic
        shell: bash
        run: |
          # Every file that is not platform-specific, not a command, and does not
          # need a real display. Selecting by SHAPE rather than by a list of
          # names means a new portable file is gated the day it is written,
          # instead of the day someone remembers to add it here.
          #
          # The platform suffixes are Go's OWN vocabulary, not a list of our
          # file names: the toolchain decides what each one compiles for, so a
          # new adapter is excluded the day it is added.
          #
          # A _display.go suffix is the third shape: code that can only run with a
          # window server in front of it. It is NAMED rather than listed, so the
          # exemption is visible in the file name instead of buried in CI, and
          # it stays deliberately thin — wiring pieces that ARE covered.
          go tool cover -func=cover.out \
            | grep -vE '_(darwin|linux|android|windows|js|other)\.go:' \
            | grep -v '_display\.go:' \
            | grep -v '/cmd/' \
            | grep -v '^total:' > portable.txt || true
          cat portable.txt
          if [ ! -s portable.txt ]; then
            echo "::error::no portable files were measured at all; the filter is wrong"; exit 1
          fi
          if grep -v '100\.0%' portable.txt; then
            echo "::error::the portable logic is below 100% (lines above)"; exit 1
          fi
          echo "portable logic: 100%"

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # All six of Go's 64-bit architectures, then every platform the
          # Platforms table above makes a claim about.
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: android, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

  linux:
    name: linux (portable logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: CGO_ENABLED=0 go test -count=1 ./...
